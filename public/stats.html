<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aaj Kya Banwaye · stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root{--bg:#FBF3E1;--ink:#2B1D14;--soft:#6B5A48;--card:#F3E9D2;--line:rgba(43,29,20,.14);--gold:#C08415;--green:#3F6C4B;--white:#fff;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:24px 18px 60px;}
.wrap{max-width:760px;margin:0 auto;}
h1{font-family:Georgia,serif;font-weight:600;font-size:24px;margin:0 0 2px;}
.sub{color:var(--soft);font-size:13px;margin:0 0 22px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px;}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.tile .n{font-family:Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;}
.tile .l{font-size:12px;color:var(--soft);margin-top:3px;}
.tile.hero{background:var(--green);color:#EAF0EA;border-color:transparent;grid-column:1/-1;}
.tile.hero .n{font-size:40px;}
.tile.hero .l{color:#DCE7DC;}
.section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin:0 0 10px;}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.bar{height:8px;background:var(--gold);border-radius:100px;}
.barwrap{flex:1;margin:0 12px;background:rgba(43,29,20,.08);border-radius:100px;}
.muted{color:var(--soft);font-size:12px;}
.gate{max-width:340px;margin:60px auto;text-align:center;}
.gate input{width:100%;padding:11px;font-size:16px;border:1px solid var(--line);border-radius:8px;margin:10px 0;}
.gate button{width:100%;padding:11px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;border:none;border-radius:8px;cursor:pointer;}
.err{color:#A63D2F;font-size:13px;margin-top:8px;}
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none;">
  <h1>🍲 Stats</h1>
  <p class="sub">Enter your stats key.</p>
  <input type="password" id="key" placeholder="stats key" />
  <button id="go">View</button>
  <div class="err" id="err"></div>
</div>

<div class="wrap" id="board" style="display:none;">
  <h1>🍲 Aaj Kya Banwaye</h1>
  <p class="sub" id="asof"></p>
  <div class="grid" id="tiles"></div>
  <div class="section"><h2>New households · last 14 days</h2><div id="perday"></div></div>
  <div class="section"><h2>Cuisines chosen</h2><div id="cuisines"></div></div>
  <p class="muted">All numbers are aggregates — no names or phone numbers. Retention = of households older than 7 days, the share active in the last 7 days.</p>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  let key = params.get('key') || '';
  const $ = id => document.getElementById(id);
  function tile(n, l, hero){ return `<div class="tile ${hero?'hero':''}"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
  async function load(){
    try{
      const res = await fetch('/api/stats?key=' + encodeURIComponent(key));
      if(!res.ok) throw new Error(res.status===403?'Wrong key':'Stats are off (set STATS_KEY on the server)');
      const s = await res.json();
      $('gate').style.display='none'; $('board').style.display='block';
      $('asof').textContent = 'As of ' + new Date(s.generatedAt).toLocaleString();
      const ret = s.weekRetentionPct==null ? '—' : s.weekRetentionPct + '%';
      $('tiles').innerHTML =
        tile(ret + (s.cohortSize?` <span style="font-size:14px;font-weight:400;">of ${s.cohortSize} households</span>`:''), 'Week-1 retention · still active after 7 days', true) +
        tile(s.totalRooms, 'Households total') +
        tile(s.activeLast7, 'Active this week') +
        tile(s.activeLast30, 'Active this month') +
        tile(s.newRoomsLast7, 'New this week') +
        tile(s.joinedMembers + ' / ' + s.totalMembers, 'Members joined') +
        tile(s.plan.made, 'Meals cooked (logged)') +
        tile(s.plan.proposed + s.plan.agreed + s.plan.made, 'Meals decided') +
        tile(s.totalDishes, 'Dishes across rooms');
      // per-day bars
      const days = [];
      for(let i=13;i>=0;i--){ const d=new Date(s.generatedAt); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
      const max = Math.max(1, ...days.map(d=>s.newRoomsPerDay[d]||0));
      $('perday').innerHTML = days.map(d=>{
        const v = s.newRoomsPerDay[d]||0;
        return `<div class="row"><span class="muted">${d.slice(5)}</span><div class="barwrap"><div class="bar" style="width:${Math.round(100*v/max)}%"></div></div><span>${v}</span></div>`;
      }).join('');
      // cuisines
      const cz = Object.entries(s.cuisines).sort((a,b)=>b[1]-a[1]);
      $('cuisines').innerHTML = cz.length ? cz.map(([c,n])=>`<div class="row"><span>${c.replace(/-/g,' ')}</span><span>${n}</span></div>`).join('') : '<span class="muted">No cuisine data yet.</span>';
    }catch(e){
      $('board').style.display='none'; $('gate').style.display='block';
      $('err').textContent = e.message || 'Could not load stats';
    }
  }
  $('go').addEventListener('click', ()=>{ key = $('key').value.trim(); load(); });
  $('key').addEventListener('keydown', e=>{ if(e.key==='Enter') $('go').click(); });
  if(key) load(); else $('gate').style.display='block';
})();
</script>
</body>
</html>
